<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand-Sketched AI Notebook</title>
    <meta name="description" content="An AI brainstorming sketchbook featuring pencil-style drawings, rough sketch borders, notebook paper textures, and interactive wireframe elements." />
    <meta property="og:title" content="Hand-Sketched AI Notebook" />
    <meta property="og:description" content="An AI brainstorming sketchbook featuring pencil-style drawings, rough sketch borders, notebook paper textures, and interactive wireframe elements." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@400..700&family=Patrick+Hand&family=Gaegu:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8F5EC] text-[#2C2B29] selection:bg-[#F3E7C4] selection:text-[#1F1E1D]">
    <!-- Hidden SVG pencil sketch filter for rough edges -->
    <svg class="hidden" width="0" height="0" aria-hidden="true">
      <defs>
        <filter id="pencil-texture" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="sketch-rough" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="roughNoise" />
          <feDisplacementMap in="SourceGraphic" in2="roughNoise" scale="1.8" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
